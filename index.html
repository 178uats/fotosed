<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor de Fotos iPod</title>

  <!-- Favicon ultraligero compatible con GitHub Pages -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">

  <!-- Configuración para pantalla completa en iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FotoEditor">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, HelveticaNeue, sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1c1c1e;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2c2c2e;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      color: #ff9500;
    }
    .btn-action {
      background: #ff9500;
      color: #fff;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .btn-action:active {
      opacity: 0.8;
    }
    input[type="file"] { display: none; }

    /* Área de Trabajo de la Imagen */
    .editor-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background-color: #121212;
      overflow: hidden;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    .placeholder-text {
      color: #666;
      font-size: 14px;
      text-align: center;
    }

    /* Panel de Controles de Edición */
    .controls-panel {
      background-color: #1c1c1e;
      border-top: 1px solid #2c2c2e;
      padding: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .slider-group {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slider-group label {
      font-size: 12px;
      color: #aaa;
      width: 80px;
    }
    .slider-group input[type="range"] {
      flex: 1;
      accent-color: #ff9500;
      margin: 0 10px;
    }
    .slider-group span {
      font-size: 11px;
      color: #ff9500;
      width: 35px;
      text-align: right;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      gap: 5px;
    }
    .btn-secondary {
      flex: 1;
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #3a3a3c;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .btn-secondary:active {
      background: #3a3a3c;
    }
  </style>
</head>
<body>

  <header>
    <h1>FotoEditor</h1>
    <div>
      <label class="btn-action" for="fileInput">Abrir</label>
      <input type="file" id="fileInput" accept="image/*" onchange="cargarImagen(event)">
      <button class="btn-action" onclick="descargarImagen()">Guardar</button>
    </div>
  </header>

  <div class="editor-container">
    <canvas id="canvas"></canvas>
    <div id="placeholder" class="placeholder-text">Toca "Abrir" para seleccionar una foto de tu iPod</div>
  </div>

  <div class="controls-panel">
    <!-- Ajustes Básicos -->
    <div class="slider-group">
      <label>Brillo</label>
      <input type="range" id="bright" min="-100" max="100" value="0" oninput="aplicarFiltros()">
      <span id="v-bright">0</span>
    </div>

    <div class="slider-group">
      <label>Contraste</label>
      <input type="range" id="contrast" min="-100" max="100" value="0" oninput="aplicarFiltros()">
      <span id="v-contrast">0</span>
    </div>

    <div class="slider-group">
      <label>Saturación</label>
      <input type="range" id="saturate" min="-100" max="100" value="0" oninput="aplicarFiltros()">
      <span id="v-saturate">0</span>
    </div>

    <!-- Botones de Acción Rápida -->
    <div class="btn-row">
      <button class="btn-secondary" onclick="rotarImagen()">🔄 Rotar</button>
      <button class="btn-secondary" onclick="aplicarEfecto('bw')">⬛ B&N</button>
      <button class="btn-secondary" onclick="aplicarEfecto('sepia')">📜 Sepia</button>
      <button class="btn-secondary" onclick="resetFiltros()">❌ Reset</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var imgOriginal = new Image();
    var imagenCargada = false;
    var rotacionGrados = 0;

    function cargarImagen(e) {
      var reader = new FileReader();
      reader.onload = function(event) {
        imgOriginal = new Image();
        imgOriginal.onload = function() {
          imagenCargada = true;
          document.getElementById('placeholder').style.display = 'none';
          resetFiltros();
        };
        imgOriginal.src = event.target.result;
      };
      if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    }

    function aplicarFiltros() {
      if (!imagenCargada) return;

      var b = parseInt(document.getElementById('bright').value, 10);
      var c = parseInt(document.getElementById('contrast').value, 10);
      var s = parseInt(document.getElementById('saturate').value, 10);

      document.getElementById('v-bright').innerText = b;
      document.getElementById('v-contrast').innerText = c;
      document.getElementById('v-saturate').innerText = s;

      // Ajustar dimensiones del Canvas por si hay rotación
      if (rotacionGrados % 180 !== 0) {
        canvas.width = imgOriginal.height;
        canvas.height = imgOriginal.width;
      } else {
        canvas.width = imgOriginal.width;
        canvas.height = imgOriginal.height;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();

      // Mover el origen al centro para aplicar rotación
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((rotacionGrados * Math.PI) / 180);
      ctx.drawImage(imgOriginal, -imgOriginal.width / 2, -imgOriginal.height / 2);
      ctx.restore();

      // Modificación directa de pixeles compatible con Safari de iOS 9
      var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var data = imgData.data;

      var factorContraste = (259 * (c + 255)) / (255 * (259 - c));
      var factorSaturacion = (s + 100) / 100;

      for (var i = 0; i < data.length; i += 4) {
        var r = data[i];
        var g = data[i + 1];
        var bCol = data[i + 2];

        // 1. Brillo
        r += b;
        g += b;
        bCol += b;

        // 2. Contraste
        r = factorContraste * (r - 128) + 128;
        g = factorContraste * (g - 128) + 128;
        bCol = factorContraste * (bCol - 128) + 128;

        // 3. Saturación
        var gris = 0.2989 * r + 0.5870 * g + 0.1140 * bCol;
        r = gris + factorSaturacion * (r - gris);
        g = gris + factorSaturacion * (g - gris);
        bCol = gris + factorSaturacion * (bCol - gris);

        // Clampar valores entre 0 y 255
        data[i] = Math.min(255, Math.max(0, r));
        data[i + 1] = Math.min(255, Math.max(0, g));
        data[i + 2] = Math.min(255, Math.max(0, bCol));
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function rotarImagen() {
      if (!imagenCargada) return;
      rotacionGrados = (rotacionGrados + 90) % 360;
      aplicarFiltros();
    }

    function aplicarEfecto(tipo) {
      if (!imagenCargada) return;
      if (tipo === 'bw') {
        document.getElementById('saturate').value = -100;
      } else if (tipo === 'sepia') {
        document.getElementById('bright').value = 10;
        document.getElementById('contrast').value = 10;
        document.getElementById('saturate').value = -50;
      }
      aplicarFiltros();
    }

    function resetFiltros() {
      document.getElementById('bright').value = 0;
      document.getElementById('contrast').value = 0;
      document.getElementById('saturate').value = 0;
      rotacionGrados = 0;
      aplicarFiltros();
    }

    function descargarImagen() {
      if (!imagenCargada) return;
      var enlace = document.createElement('a');
      enlace.download = 'foto_editada.png';
      enlace.href = canvas.toDataURL('image/png');
      enlace.click();
    }
  </script>
</body>
</html>
